services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: sec_research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sec_research"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  mcp:
    build: .
    environment:
      SEC_USER_AGENT: ${SEC_USER_AGENT:-sec-research-demo contact@example.com}
      SEC_REQUESTS_PER_SECOND: ${SEC_REQUESTS_PER_SECOND:-5}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/sec_research
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_URL: http://mcp:8000/mcp
    volumes:
      - raw-data:/app/data/raw
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import httpx; httpx.get('http://127.0.0.1:8000/health/live', timeout=2).raise_for_status()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s

  demo:
    build: .
    command:
      - python
      - -m
      - streamlit
      - run
      - src/sec_research/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      SEC_USER_AGENT: ${SEC_USER_AGENT:-sec-research-demo contact@example.com}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/sec_research
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MCP_URL: http://mcp:8000/mcp
    ports:
      - "127.0.0.1:${DEMO_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import httpx; httpx.get('http://127.0.0.1:8501/_stcore/health', timeout=2).raise_for_status()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  postgres-data:
  raw-data:
