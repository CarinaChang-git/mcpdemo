[project]
name = "sec-filing-research-agent"
version = "0.1.0"
description = "以 SEC 官方資料為唯一語料來源的財報研究 Demo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "lxml>=6,<7",
    "mcp>=2,<3",
    "openai>=2,<3",
    "pgvector>=0.4,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2,<3",
    "streamlit>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9"]
build-backend = "uv_build"

[project.scripts]
sec-research = "sec_research.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "sec_research"
